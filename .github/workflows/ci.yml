name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: challenge
          POSTGRES_PASSWORD: challenge
          POSTGRES_DB: challenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U challenge -d challenge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://challenge:challenge@localhost:5432/challenge
      TEST_DATABASE_URL: postgresql+psycopg://challenge:challenge@localhost:5432/challenge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
